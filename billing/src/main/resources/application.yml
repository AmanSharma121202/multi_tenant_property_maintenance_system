spring:
  couchbase:
    connection-string: couchbase://localhost
    username: Administrator
    password: Aman@2003

  data:
    couchbase:
      bucket-name: prop-tax
      scope-name: main

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 10
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.trusted.packages: "com.housing.billing.*"

server:
  port: 8081

app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTTokenGeneration256BitsMinimum!!
    expiration-ms: 86400000
  billing:
    payment-terms-days: 15
  async:
    invoice-generation:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 200
      tenant-scan-cron: "0 */1 * * * *"
      tenant-timezone: "UTC"
  kafka:
    enabled: true
    delay:
      fixed-delay-ms: 60000
      max-attempts: 20
    topics:
      tenant-invoice-due: billing.tenant.invoice.due.v1
      owner-unit-linked: billing.owner.unit.linked.v1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} [%thread] %msg%n"
  level:
    com.housing.billing: DEBUG
    org.springframework.data.couchbase: DEBUG
com:
  housing:
    billing:
      tenant:
        validCurrency: [INR, USD, EUR, GBP]
        validLateFeeType: [PERCENTAGE, FIXED, NONE]
        validProfileCode: [1BHK, 2BHK, 3BHK, VILLA]
        validCode: [1BHK, 2BHK, 3BHK, VILLA]
